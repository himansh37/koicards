<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoiCards</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1e1e1e" />
    <meta name="description" content="Create Japanese flashcards from images with audio and mnemonics." />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <!-- Favicon Links -->
    <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="./icon-192.png">

    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body data-theme="dark">
    <!-- UI Buttons -->

    <a href="./Preliminary_Lesson.pdf" target="_blank" rel="noopener"
       id="vocab-pdf-btn"
       title="Beginner Japanese Vocab PDF"
       style="display:inline-flex; align-items:center; justify-content:center;
              width:38px; height:38px; border-radius:50%;
              background:rgba(255,255,255,0.08);
              border:1px solid rgba(255,255,255,0.15);
              color:white; text-decoration:none; cursor:pointer;
              transition: background 0.2s;">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
    </a>

    <button id="install-app-btn" title="Install App" style="display: none;" aria-label="Install App">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
    </button>

    <div id="main-content" class="w-full">
        <div class="container p-8">
            <div id="streak-display">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path
                        d="M12.82 3.3C12.42 2.5 11.58 2.5 11.18 3.3L10.5 4.7C9.3 4.2 8.3 4.7 7.9 5.8L7.3 7.5C6.8 8.7 7.3 9.7 8.5 10.2L9.8 10.8C10.2 11 10.2 11.6 9.9 11.8C9.5 12.2 8.9 12.1 8.5 11.8L7.2 11.2C6 10.7 5 11.2 4.5 12.3L3.9 14C3.4 15.2 3.9 16.2 5.1 16.7L6.4 17.3C6.8 17.5 6.8 18.1 6.5 18.3C6.1 18.7 5.5 18.6 5.1 18.3L3.8 17.7C2.6 17.2 1.6 17.7 1.1 18.8L0.5 20.5C-0.2 22.1 1.2 23.5 2.8 22.8L18.7 16.2C20.3 15.5 21.2 13.6 20.3 12L19.2 9.5C18.7 8.5 17.5 8.1 16.5 8.6L15.2 9.2C14.8 9.4 14.2 9.2 14 8.8C13.6 8.4 13.8 7.8 14.2 7.6L15.5 7C16.7 6.5 17.2 5.5 16.7 4.3L16.1 2.6C15.6 1.4 14.6 0.9 13.4 1.4L12.2 2C11.7 2.1 11.4 2.7 11.6 3.1C11.9 3.5 12.5 3.7 12.9 3.5L12.82 3.3Z" />
                </svg>
                <span id="streak-count">0</span>
            </div>

            <h1 class="text-5xl lg:text-7xl font-bold mb-4 tracking-tighter text-white drop-shadow-lg">
                Japanese Flashcard Creator
            </h1>
            <p class="mb-8" style="color: var(--text-secondary-color);">Upload an image to create flashcards with audio
                and mnemonics.</p>

            <div class="flex flex-col md:flex-row items-center justify-center space-y-4 md:space-y-0 md:space-x-4">
                <label for="imageUpload"
                    class="cursor-pointer group relative px-8 py-4 bg-white/5 hover:bg-white/10 backdrop-blur-md border border-white/10 rounded-2xl transition-all duration-300 hover:scale-105 hover:shadow-lg hover:shadow-white/10 text-white font-semibold overflow-hidden">
                    <span class="relative z-10 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                        </svg>
                        Choose Image
                    </span>
                </label>
                <input type="file" id="imageUpload" accept="image/*" class="hidden">
                <button id="generateBtn"
                    class="group relative px-8 py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl transition-all duration-300 hover:scale-105 hover:shadow-lg hover:shadow-blue-500/40 backdrop-blur-sm border border-white/10">
                    <span class="flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                        Generate Flashcards
                    </span>
                </button>
            </div>

            <div class="flex flex-col items-center justify-center gap-2 mt-6">
                <label for="mnemonicLangSelect" class="text-sm font-medium" style="color: var(--text-secondary-color);">Mnemonic style:</label>
                <select id="mnemonicLangSelect"
                    class="bg-white/5 hover:bg-white/10 border border-white/10 backdrop-blur-md rounded-xl px-4 py-2 text-sm font-medium text-white cursor-pointer transition-all duration-300">
                    <option value="english" selected>🇺🇸 English only (default)</option>
                    <option value="hinglish">🇮🇳 Hinglish</option>
                    <option value="chinese">🇨🇳 Chinese hints</option>
                    <option value="korean">🇰🇷 Korean hints</option>
                    <option value="indonesian">🇮🇩 Indonesian hints</option>
                    <option value="portuguese">🇧🇷 Portuguese hints</option>
                    <option value="german">🇩🇪 German hints</option>
                    <option value="spanish">🇲🇽 Spanish hints</option>
                    <option value="taiwanese">🇹🇼 Taiwanese hints</option>
                    <option value="vietnamese">🇻🇳 Vietnamese hints</option>
                </select>
            </div>

            <div id="statusMessage" class="text-sm mt-4" style="color: var(--text-secondary-color);"></div>
            <div id="loading" class="loading-spinner"></div>
        </div>

        <!-- Motivational Message Display -->
        <!-- Motivational Overlay -->
        <div id="motivational-message-display" class="motivational-overlay">
            <div class="motivational-content glass-panel">
                <blockquote id="motivational-text"
                    class="text-2xl md:text-4xl font-serif italic mb-6 leading-relaxed text-white/90 drop-shadow-md">
                    "Your quote will appear here."
                </blockquote>
                <p id="motivational-author" class="text-lg md:text-xl font-medium text-white/70 mb-8">
                    - Author Name
                </p>
                <button id="continue-study-btn"
                    class="px-8 py-3 bg-white/5 hover:bg-white/10 text-gray-200 border border-white/10 rounded-2xl transition-all duration-300 hover:scale-105 backdrop-blur-sm font-semibold shadow-lg shadow-black/20 text-lg">
                    Continue Studying
                </button>
            </div>
        </div>

        <div id="flashcard-display" class="w-full flex-col items-center" style="display: none;">
            <div id="current-flashcard" class="flashcard-container"></div>
            <div id="repetition-buttons" class="flex justify-center gap-4 mt-4" style="display: none;">
                <button id="dont-repeat-btn"
                    class="px-6 py-3 bg-white/5 hover:bg-green-500/20 text-gray-300 hover:text-green-200 border border-white/10 hover:border-green-500/30 rounded-xl transition-all hover:scale-105 backdrop-blur-sm font-semibold">Don't
                    Repeat</button>
                <button id="repeat-btn"
                    class="px-6 py-3 bg-white/5 hover:bg-yellow-500/20 text-gray-300 hover:text-yellow-200 border border-white/10 hover:border-yellow-500/30 rounded-xl transition-all hover:scale-105 backdrop-blur-sm font-semibold">Repeat</button>
                <button id="repeat-frequently-btn"
                    class="px-6 py-3 bg-white/5 hover:bg-red-500/20 text-gray-300 hover:text-red-200 border border-white/10 hover:border-red-500/30 rounded-xl transition-all hover:scale-105 backdrop-blur-sm font-semibold">Repeat
                    Frequently</button>
            </div>
            <div class="mt-4 flex flex-wrap justify-center gap-2">
                <button id="saveDeckBtn"
                    class="px-5 py-2.5 bg-white/5 hover:bg-teal-500/20 text-gray-300 hover:text-teal-200 border border-white/10 hover:border-teal-500/30 rounded-lg transition-all hover:-translate-y-1 backdrop-blur-sm font-medium">Save
                    Current Deck</button>
                <button id="exportJsonBtn"
                    class="px-5 py-2.5 bg-white/5 hover:bg-orange-500/20 text-gray-300 hover:text-orange-200 border border-white/10 hover:border-orange-500/30 rounded-lg transition-all hover:-translate-y-1 backdrop-blur-sm font-medium">Export
                    JSON</button>
            </div>
        </div>

        <div id="decks-container" class="container p-8">
            <h2 class="text-2xl font-bold mb-4" style="color: var(--text-primary-color);">📚 My Decks</h2>
            <div
                class="flex flex-col md:flex-row items-center justify-center space-y-3 md:space-y-0 md:space-x-4 mb-4 w-full">
                <button id="selectTestDecksBtn"
                    class="w-full md:w-auto px-6 py-4 bg-white/5 hover:bg-white/10 text-gray-200 border border-white/10 rounded-2xl transition-all hover:scale-105 backdrop-blur-sm font-semibold shadow-lg shadow-black/20 text-lg">Select
                    Decks for Test</button>
                <button id="selectStudyDecksBtn"
                    class="w-full md:w-auto px-6 py-4 bg-white/5 hover:bg-white/10 text-gray-200 border border-white/10 rounded-2xl transition-all hover:scale-105 backdrop-blur-sm font-semibold shadow-lg shadow-black/20 text-lg">Select
                    Decks for Study</button>
            </div>
            <div id="deck-list" class="space-y-2"></div>
        </div>

        <div id="progress-container" class="container p-8">
            <h2 class="text-2xl font-bold mb-4" style="color: var(--text-primary-color);">📈 My Progress</h2>
            <div id="progress-list" class="space-y-2"></div>
            <div id="progress-chart-container" class="mt-8" style="display: none;">
                <h3 id="chart-title" class="text-xl font-bold mb-4"></h3>
                <canvas id="progress-chart"></canvas>
            </div>
        </div>
    </div>

    <!-- Test View Container -->
    <div id="test-view" class="container p-8" style="display: none;">
        <div id="test-container">
            <h2 class="text-3xl font-bold mb-6" style="color: var(--text-primary-color);">🎯 Test Mode</h2>
            <div id="test-question" class="mb-8"></div>
            <div id="test-options" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            <p id="test-progress" class="mt-8"></p>
            <button id="exit-test-btn"
                class="mt-8 bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg">Exit Test</button>
        </div>
    </div>

    <!-- Modals -->
    <div id="deck-modal" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true"
        aria-labelledby="modal-title">
        <div class="modal-content">
            <h3 id="modal-title" class="text-xl font-bold mb-4">Save Deck</h3>
            <label for="deck-name-input" class="sr-only">Deck Name</label>
            <input type="text" id="deck-name-input" placeholder="Enter deck name" class="w-full p-2 rounded-lg mb-4">
            <div class="flex justify-end space-x-2">
                <button id="modal-cancel-btn"
                    class="px-4 py-2 bg-white/5 hover:bg-white/10 text-white/70 border border-white/10 rounded-lg transition-colors backdrop-blur-sm">Cancel</button>
                <button id="modal-save-btn"
                    class="px-4 py-2 bg-blue-500/80 hover:bg-blue-500 text-white font-semibold rounded-lg transition-all shadow-lg shadow-blue-500/20">Save</button>
            </div>
        </div>
    </div>

    <div id="test-type-modal" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true"
        aria-labelledby="test-type-title">
        <div class="modal-content">
            <h3 id="test-type-title" class="text-xl font-bold mb-4">Choose Test Type</h3>
            <div class="flex flex-col space-y-4">
                <button id="ja-to-en-btn"
                    class="p-4 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl transition-all hover:scale-105 backdrop-blur-sm text-left group">
                    <span class="block text-lg font-bold text-white mb-1">Japanese to English</span>
                    <span class="text-sm text-white/50">Show Japanese, answer in English</span>
                </button>
                <button id="en-to-ja-btn"
                    class="p-4 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl transition-all hover:scale-105 backdrop-blur-sm text-left group">
                    <span class="block text-lg font-bold text-white mb-1">English to Japanese</span>
                    <span class="text-sm text-white/50">Show English, answer in Japanese</span>
                </button>
            </div>
            <button id="test-type-cancel-btn"
                class="mt-6 w-full py-3 bg-white/5 hover:bg-white/10 text-white/70 border border-white/10 rounded-lg transition-colors backdrop-blur-sm">Cancel</button>
        </div>
    </div>

    <div id="select-decks-modal" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true"
        aria-labelledby="select-modal-title">
        <div class="modal-content">
            <h3 id="select-modal-title" class="text-xl font-bold mb-4">Select Decks for Test</h3>
            <div id="deck-selection-list" class="space-y-2 mb-4"></div>
            <div class="flex justify-end space-x-2">
                <button id="select-modal-cancel-btn"
                    class="px-4 py-2 bg-white/5 hover:bg-white/10 text-white/70 border border-white/10 rounded-lg transition-colors backdrop-blur-sm">Cancel</button>
                <button id="select-modal-primary-btn"
                    class="px-4 py-2 bg-blue-500/80 hover:bg-blue-500 text-white font-semibold rounded-lg transition-all shadow-lg shadow-blue-500/20">Start
                    Test</button>
            </div>
        </div>
    </div>

    <div id="test-results-modal" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true"
        aria-labelledby="results-title">
        <div class="modal-content text-center">
            <h3 id="results-title" class="text-2xl font-bold mb-4">🎉 Test Complete!</h3>
            <div class="flex justify-around items-center my-6">
                <div>
                    <p class="text-lg" style="color: var(--text-secondary-color);">Score</p>
                    <p id="final-score" class="text-4xl font-bold"></p>
                </div>
                <div>
                    <p class="text-lg" style="color: var(--text-secondary-color);">Time Taken</p>
                    <p id="time-taken" class="text-4xl font-bold"></p>
                </div>
            </div>
            <div id="results-breakdown" class="text-left mt-6 space-y-2">
                <h4 class="text-xl font-bold mb-2">📝 Review:</h4>
                <!-- Breakdown will be inserted here -->
            </div>
            <button id="close-results-btn"
                class="mt-8 px-8 py-3 bg-blue-500/80 hover:bg-blue-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-blue-500/20 hover:scale-105">Close</button>
        </div>
    </div>

    <div id="toast-notification">Deck saved!</div>

    <!-- GSAP for smooth animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="storage.js"></script>


    <script src="app.js"></script>
</body>

</html>
